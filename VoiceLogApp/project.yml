name: VoiceLogApp
options:
  bundleIdPrefix: com.voicelog
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

targets:
  VoiceLogApp:
    type: application
    platform: iOS
    sources:
      - VoiceLogApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicelog.VoiceLogApp
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "VoiceLog needs microphone access to record voice notes"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "VoiceLog uses speech recognition to transcribe your voice notes"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: true
    entitlements:
      path: VoiceLogApp/VoiceLogApp.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
